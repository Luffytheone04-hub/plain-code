name: Build Acode Plugin

on:
  push:
    branches:
      - main
    paths:
      - "plain-acode/**"
      - ".github/workflows/build.yml"

  pull_request:
    paths:
      - "plain-acode/**"
      - ".github/workflows/build.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Acode Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Plain tests
        run: npm test

      - name: Verify Acode plugin files
        run: |
          test -f plain-acode/plugin.json
          test -f plain-acode/main.js

          echo "Acode plugin files:"
          ls -lah plain-acode

      - name: Package Acode plugin
        run: |
          mkdir -p dist

          cd plain-acode
          zip -r ../dist/plain-acode-plugin.zip . \
            -x "*.git*" \
            -x "node_modules/*"

      - name: Verify plugin ZIP
        run: |
          echo "Plugin package:"
          ls -lh dist/plain-acode-plugin.zip

          echo
          echo "ZIP contents:"
          unzip -l dist/plain-acode-plugin.zip

      - name: Upload Acode plugin
        uses: actions/upload-artifact@v4
        with:
          name: plain-acode-plugin
          path: dist/plain-acode-plugin.zip
          if-no-files-found: error