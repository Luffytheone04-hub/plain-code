name: Build Acode Plugin

on:
  push:
    branches:
      - main
    paths:
      - "plain-acode/**"
      - ".github/workflows/build.yml"

  pull_request:
    paths:
      - "plain-acode/**"
      - ".github/workflows/build.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Acode Plugin
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: plain-acode

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build Acode plugin
        run: npm run build

      - name: Show build output
        run: |
          echo "Build contents:"
          ls -lah

          echo
          echo "ZIP files:"
          find . -maxdepth 3 -type f -name "*.zip" -print

      - name: Upload Acode plugin
        uses: actions/upload-artifact@v4
        with:
          name: plain-acode-plugin
          path: plain-acode/**/*.zip
          if-no-files-found: error